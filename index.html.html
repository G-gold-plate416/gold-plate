<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵金属及外汇实时行情盘</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* 涨跌闪烁动画效果 */
        @keyframes flash-red { 0% { background-color: rgba(239, 68, 68, 0.4); } 100% { background-color: transparent; } }
        @keyframes flash-green { 0% { background-color: rgba(34, 197, 94, 0.4); } 100% { background-color: transparent; } }
        .animate-flash-red { animation: flash-red 1s ease-out; }
        .animate-flash-green { animation: flash-green 1s ease-out; }
    </style>
</head>
<body class="bg-[#121212] text-white font-sans antialiased min-h-screen p-4">

    <div class="max-w-md mx-auto bg-[#1a1a1a] rounded-xl shadow-2xl border border-gray-800 overflow-hidden">
        <div class="flex justify-between items-center p-4 border-b border-gray-800 bg-[#151515]">
            <div id="current-time" class="text-red-500 font-mono text-sm">2026-05-16 00:00:00</div>
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-green-500 text-xs font-bold tracking-wider">实时行情</span>
            </div>
        </div>

        <div class="p-2">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="text-gray-400 text-xs border-b border-gray-800 bg-[#141414]">
                        <th class="py-3 font-normal">商品/指标</th>
                        <th class="py-3 font-normal">卖出/最新</th>
                        <th class="py-3 font-normal">买入/昨收</th>
                        <th class="py-3 font-normal">最高/最低</th>
                    </tr>
                </thead>
                <tbody id="gold-table-body">
                    </tbody>
                <thead id="forex-header" class="hidden">
                    <tr class="text-gray-400 text-xs border-b border-gray-800 bg-[#1e1e1e]">
                        <th colspan="4" class="py-2 text-left pl-4 text-blue-400 font-bold">外汇与外盘指数</th>
                    </tr>
                </thead>
                <tbody id="forex-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. 顶部时间每秒更新
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleString();
        }, 1000);

        // 临时存储上一次的数据，用于对比价格涨跌
        let previousData = {};

        // 2. 核心：请求数据
        async function fetchMarketData() {
            try {
                // ⚠️ 真实开发中，替换为你的复合 API（同时返回金价和汇率）
                // const response = await fetch('https://api.example.com/market/live'); 
                // const result = await response.json();
                // renderTable(result.metals, result.forex);
                
                throw new Error("检测到未配置真实API，自动启用模拟数据...");
            } catch (error) {
                console.log(error.message);
                generateMockData();
            }
        }

        // 通用的行渲染函数，处理红绿闪烁逻辑
        function generateRowHtml(item) {
            const prev = previousData[item.name] || {};
            
            let sellColor = 'text-white';
            let sellFlash = '';
            if (prev.sell) {
                if (parseFloat(item.sell) > parseFloat(prev.sell)) { sellColor = 'text-red-500'; sellFlash = 'animate-flash-red'; }
                else if (parseFloat(item.sell) < parseFloat(prev.sell)) { sellColor = 'text-green-500'; sellFlash = 'animate-flash-green'; }
            }

            let buyColor = 'text-white';
            let buyFlash = '';
            if (prev.buy) {
                if (parseFloat(item.buy) > parseFloat(prev.buy)) { buyColor = 'text-red-500'; buyFlash = 'animate-flash-red'; }
                else if (parseFloat(item.buy) < parseFloat(prev.buy)) { buyColor = 'text-green-500'; buyFlash = 'animate-flash-green'; }
            }

            // 存入当前数据以便下一次对比
            previousData[item.name] = { sell: item.sell, buy: item.buy };

            return `
                <tr class="border-b border-gray-900 hover:bg-[#202020] transition-colors">
                    <td class="py-4 text-sm text-yellow-500 font-medium">${item.name}</td>
                    <td class="py-4 font-mono font-bold ${sellColor} ${sellFlash}">${item.sell}</td>
                    <td class="py-4 font-mono font-bold ${buyColor} ${buyFlash}">${item.buy}</td>
                    <td class="py-4 text-xs font-mono flex flex-col justify-center">
                        <span class="text-red-500">${item.high}</span>
                        <span class="text-green-500">${item.low}</span>
                    </td>
                </tr>
            `;
        }

        function renderTable(metalsData, forexData) {
            // 渲染贵金属
            const metalsTbody = document.getElementById('gold-table-body');
            metalsTbody.innerHTML = metalsData.map(item => generateRowHtml(item)).join('');

            // 渲染外汇
            if(forexData && forexData.length > 0) {
                document.getElementById('forex-header').classList.remove('hidden');
                const forexTbody = document.getElementById('forex-table-body');
                forexTbody.innerHTML = forexData.map(item => generateRowHtml(item)).join('');
            }
        }

        // 模拟数据生成器
        function generateMockData() {
            // 贵金属基础数据
            const baseMetals = [
                { name: '黄金', sell: 996.58, buy: 1001.58, high: 1008.23, low: 993.57 },
                { name: '铂金', sell: 408.80, buy: 507.80, high: 511.40, low: 407.60 },
                { name: '白银(含税)', sell: 18.54, buy: 18.76, high: 19.14, low: 18.53 }
            ];
            
            // 新增：汇率与外盘基础数据
            const baseForex = [
                { name: '美元指数', sell: 99.27, buy: 99.27, high: 99.32, low: 98.85 },
                { name: '美元/人民币', sell: 6.8145, buy: 6.8145, high: 6.8165, low: 6.7832 }
            ];

            // 让数据产生随机微小波动
            const fluctuate = (list, decimalPlaces) => list.map(item => {
                const change = (Math.random() - 0.5) * (10 / Math.pow(10, decimalPlaces)); 
                return {
                    name: item.name,
                    sell: (parseFloat(item.sell) + change).toFixed(decimalPlaces),
                    buy: (parseFloat(item.buy) + change).toFixed(decimalPlaces),
                    high: item.high.toFixed(decimalPlaces),
                    low: item.low.toFixed(decimalPlaces)
                }
            });

            renderTable(fluctuate(baseMetals, 2), fluctuate(baseForex, 4));
        }

        // 3. 开启每 3 秒自动轮询
        fetchMarketData(); 
        setInterval(fetchMarketData, 3000);
    </script>
</body>
</html>
